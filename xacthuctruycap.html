<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Truy Cập - Podcast A3 Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: #05040a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .cyber-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        .auth-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 12, 28, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        .scanner-icon {
            font-size: 3.5rem;
            color: #00f0ff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00f0ff;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px #a855f7); }
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .status-text {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #a855f7);
            box-shadow: 0 0 10px #00f0ff;
            animation: loadProgress 4s linear forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .timer-box {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: #00f0ff;
        }

        .skip-link {
            display: inline-block;
            margin-top: 15px;
            color: #64748b;
            font-size: 0.8rem;
            text-decoration: none;
        }
        .skip-link:hover { color: #00f0ff; }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="auth-card">
        <div class="scanner-icon" id="icon-box">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="title">XÁC THỰC TRUY CẬP</h1>
        <p class="status-text" id="status-msg">Đang kiểm tra an toàn hệ thống...</p>

        <div class="progress-bar-bg" id="progress-box">
            <div class="progress-bar-fill"></div>
        </div>

        <div class="timer-box" id="timer-box">
            TỰ ĐỘNG CHUYỂN HƯỚNG SAU <span id="countdown">4</span> GIÂY
        </div>

        <a href="home.html" class="skip-link">Bỏ qua kiểm tra &rarr;</a>
    </div>

    <script>
        const statusMsg = document.getElementById('status-msg');
        const countdownEl = document.getElementById('countdown');
        let isChecked = false;

        // Hàm cho phép vào trang chính
        function allowAccess() {
            if (isChecked) return;
            isChecked = true;
            statusMsg.innerText = "Xác thực thiết bị thành công!";
            
            let seconds = 4;
            const timer = setInterval(() => {
                seconds--;
                if (seconds >= 0) countdownEl.innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    window.location.href = "home.html";
                }
            }, 1000);
        }

        // Hàm đá ra Google
        function kickOut(msg) {
            if (isChecked) return;
            isChecked = true;
            statusMsg.style.color = '#ff0055';
            statusMsg.innerText = msg;
            document.getElementById('icon-box').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#ff0055;"></i>';
            document.getElementById('progress-box').style.display = 'none';
            document.getElementById('timer-box').style.display = 'none';

            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 1500);
        }

        // Đặt Timeout: Nếu quá 1.2 giây mà API kiểm tra IP bị đơ/chặn -> Tự động cho qua luôn!
        const safetyTimeout = setTimeout(() => {
            allowAccess();
        }, 1200);

        // Gọi API kiểm tra IP nhẹ nhất
        fetch('https://ipapi.co/json/', { method: 'GET' })
            .then(res => res.json())
            .then(data => {
                clearTimeout(safetyTimeout);
                // Nếu xác định CHẮC CHẮN không thuộc VN thì mới kick
                if (data && data.country_code && data.country_code !== 'VN') {
                    kickOut("Trang web chỉ cho phép truy cập tại Việt Nam!");
                } else {
                    allowAccess();
                }
            })
            .catch(err => {
                clearTimeout(safetyTimeout);
                allowAccess(); // Lỗi mạng / Adblock -> Mặc định cho qua
            });
    </script>
</body>
</html>
