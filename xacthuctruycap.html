<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Truy Cập - Podcast A3 Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: #05040a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .cyber-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        .auth-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 12, 28, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        .scanner-icon {
            font-size: 3.5rem;
            color: #00f0ff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00f0ff;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px #a855f7); }
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .status-text {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
            min-height: 24px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #a855f7);
            box-shadow: 0 0 10px #00f0ff;
            animation: loadProgress 4s linear forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .timer-box {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: #00f0ff;
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="auth-card">
        <div class="scanner-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="title">XÁC THỰC TRUY CẬP</h1>
        <p class="status-text" id="status-msg">Đang kiểm tra kết nối an toàn...</p>

        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>

        <div class="timer-box">
            TỰ ĐỘNG CHUYỂN HƯỚNG SAU <span id="countdown">4</span> GIÂY
        </div>
    </div>

    <script>
        const statusMsg = document.getElementById('status-msg');
        const countdownEl = document.getElementById('countdown');

        // Hiệu ứng đổi dòng chữ trạng thái cho chuyên nghiệp
        setTimeout(() => {
            statusMsg.innerText = "Đang xác thực địa chỉ IP & Thiết bị...";
        }, 1200);

        setTimeout(() => {
            statusMsg.innerText = "Xác thực thành công! Đang vào trang chính...";
            statusMsg.style.color = "#00f0ff";
        }, 2800);

        // Đếm ngược 4s chuẩn xác 100%
        let seconds = 4;
        const timer = setInterval(() => {
            seconds--;
            if (seconds >= 0) {
                countdownEl.innerText = seconds;
            }
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "home.html";
            }
        }, 1000);
    </script>
</body>
</html>
