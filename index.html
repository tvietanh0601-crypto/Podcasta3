<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PODCAST A3 - VIDEO VĂN NGHỆ</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07070e;
            --card-bg: rgba(20, 16, 38, 0.7);
            --card-border: rgba(0, 240, 255, 0.2);
            --primary-neon: #b042ff;
            --secondary-neon: #00f0ff;
            --accent-pink: #ff007f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; min-height: 100vh; padding-bottom: 30px; }

        .cyber-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 50% 20%, rgba(176, 66, 255, 0.15), transparent 70%), linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px; z-index: -1; pointer-events: none;
        }

        .navbar { 
            background: rgba(7, 7, 14, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            position: sticky; top: 0; z-index: 100; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; 
        }
        .nav-logo { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-logo i { color: var(--accent-pink); }

        .btn-nav-home {
            background: rgba(255, 255, 255, 0.08); color: #fff; padding: 7px 14px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; border: 1px solid var(--card-border);
        }

        .wrapper { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
        .page-header { text-align: center; margin-bottom: 20px; margin-top: 5px; }
        .badge-tag {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(176, 66, 255, 0.15); border: 1px solid rgba(176, 66, 255, 0.4);
            color: var(--primary-neon); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-family: 'Orbitron', sans-serif; font-weight: 700; margin-bottom: 12px;
        }
        .page-title { 
            font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; line-height: 1.2; margin-bottom: 8px; 
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-pink) 70%, var(--primary-neon) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .page-sub { color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; }

        /* MAIN PLAYER */
        .main-video-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 12px;
            backdrop-filter: blur(20px); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 14px; background: #000; box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-meta { padding: 12px 6px 4px 6px; }
        .video-active-title { font-size: 1.05rem; font-weight: 800; color: #fff; margin-bottom: 6px; line-height: 1.3; }
        .video-stats-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--text-muted); margin-top: 8px; }

        .like-btn {
            background: rgba(255, 0, 127, 0.15); border: 1px solid rgba(255, 0, 127, 0.4); color: var(--accent-pink);
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }

        /* PLAYLIST */
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 800; color: #fff; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .playlist { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }

        .empty-state {
            text-align: center; padding: 30px 15px; background: rgba(255, 255, 255, 0.02); border: 1px dashed var(--card-border);
            border-radius: 14px; color: var(--text-muted); font-size: 0.85rem;
        }

        .video-item {
            display: flex; gap: 12px; background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px;
            border-radius: 14px; cursor: pointer; transition: 0.2s; align-items: center;
        }
        .video-item:active { transform: scale(0.98); background: rgba(30, 25, 55, 0.9); }
        .video-item.active-item { border-color: var(--secondary-neon); background: rgba(0, 240, 255, 0.08); }

        .thumb-box { width: 100px; height: 62px; border-radius: 10px; background-size: cover; background-position: center; position: relative; flex-shrink: 0; overflow: hidden; }
        .thumb-play { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; color: #fff; font-size: 0.9rem; }
        .item-info { flex: 1; overflow: hidden; }
        .item-title { font-size: 0.85rem; font-weight: 700; color: #fff; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .item-duration { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; font-family: 'Orbitron', sans-serif; }

        /* COMMENTS */
        .comments-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 18px; margin-bottom: 20px; }
        .comment-input-box { display: flex; gap: 8px; margin-bottom: 14px; }
        .comment-input-box input { flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 10px 14px; color: #fff; font-size: 0.85rem; outline: none; }
        .comment-btn { background: var(--accent-pink); color: #fff; border: none; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        .comment-list { display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; }
        .comment-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 10px; font-size: 0.8rem; }
        .comment-user { font-weight: 700; color: var(--secondary-neon); margin-bottom: 2px; }

        footer { text-align: center; font-size: 0.75rem; color: #475569; margin-top: 30px; padding: 15px; }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-logo"><i class="fa-solid fa-play-circle"></i> VIDEO A3</a>
        <a href="index.html" class="btn-nav-home"><i class="fa-solid fa-house"></i> Trang Chủ</a>
    </nav>

    <div class="wrapper">
        <header class="page-header" data-aos="fade-down">
            <div class="badge-tag"><i class="fa-solid fa-film"></i> VĂN NGHỆ & SÂN KHẤU</div>
            <h1 class="page-title">VIDEO KỶ NIỆM</h1>
            <p class="page-sub">Tổng hợp những khoảnh khắc bùng nổ của tập thể A3</p>
        </header>

        <!-- MAIN PLAYER -->
        <div class="main-video-card" id="main-player-card" style="display: none;" data-aos="fade-up">
            <div class="video-wrapper">
                <iframe id="main-iframe" src="" allowfullscreen></iframe>
            </div>
            <div class="video-meta">
                <div class="video-active-title" id="main-title">Chưa chọn video</div>
                <div class="video-stats-bar">
                    <span><i class="fa-regular fa-eye"></i> <span id="view-count">1</span> lượt xem</span>
                    <button class="like-btn" onclick="addLike()">
                        <i class="fa-solid fa-heart"></i> <span id="like-count">0</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- PLAYLIST -->
        <div class="section-title" data-aos="fade-up">
            <i class="fa-solid fa-list-ul" style="color:var(--secondary-neon);"></i> DANH SÁCH VIDEO A3
        </div>

        <div class="playlist" id="playlist-container" data-aos="fade-up">
            <!-- Render từ JS -->
        </div>

        <!-- BÌNH LUẬN -->
        <section class="comments-card" data-aos="fade-up">
            <div class="section-title" style="margin-bottom:10px;">
                <i class="fa-solid fa-comments" style="color:var(--accent-pink);"></i> Bình Luận Video
            </div>
            <div class="comment-input-box">
                <input type="text" id="cmt-input" placeholder="Viết cảm nhận của bạn...">
                <button class="comment-btn" onclick="sendComment()">Gửi</button>
            </div>
            <div class="comment-list" id="cmt-list">
                <div class="comment-item">
                    <div class="comment-user">Lớp trưởng A3</div>
                    <div>Cả nhà xem video vui vẻ nhé! ❤️</div>
                </div>
            </div>
        </section>
    </div>

    <footer>
        <div>PODCAST A3 ENTERTAINMENT</div>
        <div style="margin-top:4px;">©️2026 Copyright belongs to Podcast A3 Entertainment</div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 600, once: true });

        let videoList = JSON.parse(localStorage.getItem('a3_videos')) || [];

        function renderPlaylist() {
            const container = document.getElementById('playlist-container');
            const mainCard = document.getElementById('main-player-card');

            if (videoList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open" style="font-size: 2rem; color: var(--secondary-neon); margin-bottom: 8px; display: block;"></i>
                        Chưa có video nào trong danh sách.<br>Admin chưa tải lên video mới nào!
                    </div>`;
                mainCard.style.display = 'none';
                return;
            }

            container.innerHTML = '';
            videoList.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `video-item ${index === 0 ? 'active-item' : ''}`;
                itemDiv.onclick = () => playVideo(item.embedUrl, item.title, index);

                itemDiv.innerHTML = `
                    <div class="thumb-box" style="background-image: url('${item.thumbUrl}');">
                        <div class="thumb-play"><i class="fa-solid fa-play"></i></div>
                    </div>
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        <div class="item-duration"><i class="fa-brands fa-youtube" style="color:#ff0000;"></i> YouTube</div>
                    </div>
                `;
                container.appendChild(itemDiv);
            });

            // Tự chọn video đầu tiên nếu chưa chọn
            playVideo(videoList[0].embedUrl, videoList[0].title, 0);
        }

        function playVideo(url, title, index) {
            const mainCard = document.getElementById('main-player-card');
            mainCard.style.display = 'block';

            document.getElementById('main-iframe').src = url;
            document.getElementById('main-title').innerText = title;

            const items = document.querySelectorAll('.video-item');
            items.forEach((item, idx) => {
                if(idx === index) item.classList.add('active-item');
                else item.classList.remove('active-item');
            });
        }

        let likes = 0; let isLiked = false;
        function addLike() {
            const countElem = document.getElementById('like-count');
            likes = isLiked ? likes - 1 : likes + 1;
            isLiked = !isLiked;
            countElem.innerText = likes;
        }

        function sendComment() {
            const input = document.getElementById('cmt-input');
            const txt = input.value.trim();
            if(!txt) return;

            const list = document.getElementById('cmt-list');
            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerHTML = `<div class="comment-user">Bạn học</div><div>${txt}</div>`;
            list.prepend(item);
            input.value = '';
        }

        renderPlaylist();
    </script>
</body>
</html>
