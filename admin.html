<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PODCAST A3 - ADMIN STUDIO</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07070e;
            --card-bg: rgba(20, 16, 38, 0.7);
            --card-border: rgba(0, 240, 255, 0.2);
            --primary-neon: #b042ff;
            --secondary-neon: #00f0ff;
            --accent-pink: #ff007f;
            --status-green: #00ff88;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; min-height: 100vh; padding-bottom: 30px; }

        .cyber-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 50% 20%, rgba(176, 66, 255, 0.15), transparent 70%), linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px; z-index: -1; pointer-events: none;
        }

        /* LOGIN OVERLAY */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 1000;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }

        .login-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 30px 20px;
            width: 100%; max-width: 360px; text-align: center; box-shadow: 0 0 30px rgba(176, 66, 255, 0.3); backdrop-filter: blur(15px);
        }

        .login-input {
            width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 12px; color: #fff; font-size: 1.1rem; text-align: center; letter-spacing: 4px; outline: none; margin: 15px 0;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--secondary-neon), var(--primary-neon)); color: #000;
            font-family: 'Orbitron', sans-serif; font-weight: 800; border: none; padding: 12px; border-radius: 12px; width: 100%; font-size: 0.9rem; cursor: pointer;
        }

        /* NAVBAR */
        .navbar { 
            background: rgba(7, 7, 14, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            position: sticky; top: 0; z-index: 100; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; 
        }

        .nav-logo { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 900; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-logo i { color: var(--status-green); }

        .btn-nav-view {
            background: rgba(255, 255, 255, 0.08); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-decoration: none; border: 1px solid var(--card-border);
        }

        .wrapper { padding: 20px 16px; max-width: 600px; margin: 0 auto; display: none; }

        .admin-header { text-align: center; margin-bottom: 20px; }
        .admin-title {
            font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 900;
            background: linear-gradient(135deg, #ffffff, var(--status-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .admin-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 18px; margin-bottom: 20px; backdrop-filter: blur(15px);
        }

        .card-header {
            font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 800; color: var(--secondary-neon); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
        }

        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; display: block; }
        .form-control {
            width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 0.85rem; outline: none;
        }
        .form-control:focus { border-color: var(--secondary-neon); }

        .btn-action {
            background: linear-gradient(135deg, var(--primary-neon), var(--accent-pink)); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; width: 100%; cursor: pointer; margin-top: 5px;
        }

        .data-list { display: flex; flex-direction: column; gap: 10px; }
        .data-item {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem;
        }
        .btn-del {
            background: rgba(255, 0, 0, 0.2); border: 1px solid rgba(255, 0, 0, 0.4); color: #ff4d4d; padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; cursor: pointer;
        }

        footer { text-align: center; font-size: 0.75rem; color: #475569; margin-top: 30px; padding: 15px; }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
        <div class="login-card">
            <i class="fa-solid fa-user-shield" style="font-size: 2.5rem; color: var(--secondary-neon); margin-bottom: 10px;"></i>
            <h2 style="font-family:'Orbitron'; font-size:1.2rem; color:#fff;">STUDIO ADMIN</h2>
            <p style="font-size:0.78rem; color:var(--text-muted); margin-top:4px;">Nhập mã PIN để truy cập hệ thống quản trị</p>
            <input type="password" id="pin-input" class="login-input" placeholder="••••" maxlength="4">
            <button class="btn-login" onclick="checkPin()">XÁC NHẬN PIN</button>
            <div id="login-err" style="color:#ff4d4d; font-size:0.75rem; margin-top:8px; display:none;">Mã PIN không chính xác!</div>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="#" class="nav-logo"><i class="fa-solid fa-sliders"></i> ADMIN DASHBOARD</a>
        <a href="videos.html" class="btn-nav-view" target="_blank"><i class="fa-solid fa-eye"></i> Xem Trang Video</a>
    </nav>

    <div class="wrapper" id="admin-content">
        
        <header class="admin-header" data-aos="fade-down">
            <h1 class="admin-title">BẢNG ĐIỀU KHIỂN A3</h1>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Thêm / Xóa Video YouTube hiển thị ở trang Videos</p>
        </header>

        <!-- Ô NHẬP LINK YOUTUBE -->
        <section class="admin-card" data-aos="fade-up">
            <div class="card-header"><i class="fa-solid fa-square-plus"></i> Thêm Video YouTube Mới</div>
            <div class="form-group">
                <label class="form-label">Tiêu đề Video</label>
                <input type="text" id="v-title" class="form-control" placeholder="Ví dụ: Tiết Mục Múa Lớp A3 Khai Giảng...">
            </div>
            <div class="form-group">
                <label class="form-label">Link YouTube</label>
                <input type="text" id="v-url" class="form-control" placeholder="Dán link YouTube (https://www.youtube.com/watch?v=...)">
            </div>
            <button class="btn-action" onclick="addNewVideo()"><i class="fa-solid fa-cloud-arrow-up"></i> TẢI VIDEO LÊN TRANG</button>
        </section>

        <!-- DANH SÁCH VIDEO ĐÃ THÊM -->
        <section class="admin-card" data-aos="fade-up">
            <div class="card-header"><i class="fa-solid fa-video"></i> Danh Sách Video Đang Hiển Thị</div>
            <div class="data-list" id="admin-video-list">
                <!-- Render từ JS -->
            </div>
        </section>

        <button class="btn-action" style="background:rgba(255,0,0,0.2); border:1px solid rgba(255,0,0,0.4); color:#ff4d4d;" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất Admin
        </button>

    </div>

    <footer>
        <div>PODCAST A3 CONTROL CENTER</div>
        <div style="margin-top:4px;">©️2026 Podcast A3 Entertainment</div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 600, once: true });

        // Tách YouTube ID
        function getYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Lấy danh sách video từ bộ nhớ trình duyệt
        let videoList = JSON.parse(localStorage.getItem('a3_videos')) || [];

        function checkPin() {
            const pin = document.getElementById('pin-input').value;
            if(pin === '2029') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                renderAdminList();
            } else {
                document.getElementById('login-err').style.display = 'block';
            }
        }

        function addNewVideo() {
            const title = document.getElementById('v-title').value.trim();
            const url = document.getElementById('v-url').value.trim();

            if(!title || !url) return alert('Vui lòng nhập đầy đủ tiêu đề và link YouTube!');

            const videoId = getYouTubeID(url);
            if(!videoId) return alert('Link YouTube không hợp lệ! Vui lòng kiểm tra lại.');

            const newVideo = {
                id: videoId,
                title: title,
                embedUrl: `https://www.youtube.com/embed/${videoId}?autoplay=1`,
                thumbUrl: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
            };

            videoList.push(newVideo);
            localStorage.setItem('a3_videos', JSON.stringify(videoList));

            document.getElementById('v-title').value = '';
            document.getElementById('v-url').value = '';

            renderAdminList();
            alert('Đã thêm video thành công!');
        }

        function renderAdminList() {
            const container = document.getElementById('admin-video-list');
            if(videoList.length === 0) {
                container.innerHTML = `<div style="text-align:center; font-size:0.8rem; color:var(--text-muted); padding:10px;">Chưa có video nào trong danh sách.</div>`;
                return;
            }

            container.innerHTML = '';
            videoList.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'data-item';
                div.innerHTML = `
                    <span><strong>#${index + 1}</strong> ${item.title}</span>
                    <button class="btn-del" onclick="deleteVideo(${index})"><i class="fa-solid fa-trash"></i> Xóa</button>
                `;
                container.appendChild(div);
            });
        }

        function deleteVideo(index) {
            videoList.splice(index, 1);
            localStorage.setItem('a3_videos', JSON.stringify(videoList));
            renderAdminList();
        }

        function logout() {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('admin-content').style.display = 'none';
            document.getElementById('pin-input').value = '';
        }
    </script>
</body>
</html>
